name: Fix desktop hero contain

on:
  push:
    paths:
      - '.github/workflows/fix-desktop-hero-contain.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve full desktop artwork and increase breathing room
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('sections/bhd-hero.liquid')
          s = p.read_text()

          old_padding = '    padding:20px;'
          new_padding = '    padding:clamp(36px,3.4vw,56px);'
          if old_padding not in s:
              raise SystemExit('desktop padding target not found')
          s = s.replace(old_padding, new_padding, 1)

          old_desktop = '''  #BhdHero-{{ section.id }} .bhd-hero-v3__desktop { display:block; }\n  #BhdHero-{{ section.id }} .bhd-hero-v3__desktop img {\n    aspect-ratio:16/9;\n    object-fit:cover;\n  }'''
          new_desktop = '''  #BhdHero-{{ section.id }} .bhd-hero-v3__desktop {\n    display:block;\n    width:100%;\n    max-width:1600px;\n    margin:0 auto;\n    background:#eef8fd;\n  }\n  #BhdHero-{{ section.id }} .bhd-hero-v3__desktop img {\n    width:100%;\n    height:auto;\n    aspect-ratio:auto;\n    object-fit:contain;\n    object-position:center center;\n    margin:0 auto;\n  }'''
          if old_desktop not in s:
              raise SystemExit('desktop image target not found')
          s = s.replace(old_desktop, new_desktop, 1)

          p.write_text(s)
          PY

      - name: Commit desktop hero fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'swini16'
          git config user.email '59820522+swini16@users.noreply.github.com'
          git add sections/bhd-hero.liquid
          git commit -m 'Preserve full desktop hero artwork and increase padding'
          git push origin HEAD:main
