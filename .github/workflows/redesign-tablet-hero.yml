name: Redesign tablet hero

on:
  push:
    paths:
      - '.github/workflows/redesign-tablet-hero.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild tablet hero
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('sections/bhd-hero.liquid')
          s = p.read_text()

          tablet_start = s.index('  <div class="bhd-hero-v3__tablet bhd-hero-v3__frame"')
          mobile_start = s.index('  <div class="bhd-hero-v3__mobile bhd-hero-v3__frame"', tablet_start)

          tablet_markup = '''  <div class="bhd-hero-v3__tablet bhd-hero-v3__frame" data-hero-carousel data-interval="5600" aria-label="Best Hydrate tablet hydration solutions">
    <div class="bhd-hero-v3__tablet-shell">
      <header class="bhd-hero-v3__shared-head">
        <div class="bhd-hero-v3__eyebrow">BEST HYDRATE</div>
        <div class="bhd-hero-v3__headline"><span>THE SCIENCE OF</span> HYDRATION.</div>
        <div class="bhd-hero-v3__tagline">Hydrate For <em>YOUR</em> Best Day!</div>
      </header>

      <div class="bhd-hero-v3__tablet-stage">
        <div class="bhd-hero-v3__tablet-slide is-active" data-hero-slide>
          <article class="bhd-hero-v3__segment-card bhd-hero-v3__segment-card--left">
            <img src="https://hmentca-my.sharepoint.com/:u:/g/personal/austin_besthydrate_com/IQAw2nS-N6UaS6qw21HvBAMLAaRMFz5atE3PcfQAKxBRisI?download=1" alt="Performance hydration" width="700" height="500" loading="eager" decoding="async">
            <div class="bhd-hero-v3__segment-copy">
              <strong>Performance</strong>
              <span>Fuels Higher Performance.</span>
            </div>
          </article>
          <article class="bhd-hero-v3__segment-card bhd-hero-v3__segment-card--right">
            <img src="https://hmentca-my.sharepoint.com/:u:/g/personal/austin_besthydrate_com/IQBB1GtZJ3e5Tq5bQeXKnFOtAfxDPApSvR53BzqkP-AHMI4?download=1" alt="Daily hydration" width="700" height="500" loading="eager" decoding="async">
            <div class="bhd-hero-v3__segment-copy">
              <strong>Daily</strong>
              <span>Supports Healthier Everyday Living.</span>
            </div>
          </article>
        </div>

        <div class="bhd-hero-v3__tablet-slide" data-hero-slide>
          <article class="bhd-hero-v3__segment-card bhd-hero-v3__segment-card--left">
            <img src="https://hmentca-my.sharepoint.com/:u:/g/personal/austin_besthydrate_com/IQAfdRPvWw9YRYNwoTqMLaLwAQ49LTkN45sBVbboNwA5XoI?download=1" alt="Medical hydration" width="700" height="500" loading="lazy" decoding="async">
            <div class="bhd-hero-v3__segment-copy">
              <strong>Medical</strong>
              <span>Leaders in Clinical Oral Hydration.</span>
            </div>
          </article>
          <article class="bhd-hero-v3__segment-card bhd-hero-v3__segment-card--right">
            <img src="https://hmentca-my.sharepoint.com/:u:/g/personal/austin_besthydrate_com/IQBeJ0LyvlOfTIN2ERpEN-bhAR7thysCV91p0xeC2qhjdg4?download=1" alt="Humanitarian hydration" width="700" height="500" loading="lazy" decoding="async">
            <div class="bhd-hero-v3__segment-copy">
              <strong>Humanitarian</strong>
              <span>ORS for a Brighter Tomorrow.</span>
            </div>
          </article>
        </div>

        <div class="bhd-hero-v3__tablet-core" aria-label="Best Hydrate formula">
          <div class="bhd-hero-v3__nutrient bhd-hero-v3__nutrient--na">Na<sup>+</sup></div>
          <div class="bhd-hero-v3__nutrient bhd-hero-v3__nutrient--k">K<sup>+</sup></div>
          <div class="bhd-hero-v3__nutrient bhd-hero-v3__nutrient--cl">Cl<sup>−</sup></div>
          <div class="bhd-hero-v3__nutrient bhd-hero-v3__nutrient--bicarb">HCO<sub>3</sub><sup>−</sup></div>
          <div class="bhd-hero-v3__nutrient bhd-hero-v3__nutrient--glucose">GLUCOSE</div>
          {% if hero_product_image %}
            <a class="bhd-hero-v3__tablet-product" href="{{ hero_product.url }}" aria-label="Shop Best Hydrate">
              <img src="{{ hero_product_image | image_url: width: 800 }}" alt="{{ hero_product.title | escape }}" width="800" height="800" loading="eager" decoding="async">
            </a>
          {% endif %}
        </div>

        <button class="bhd-hero-v3__arrow bhd-hero-v3__arrow--prev" type="button" data-hero-prev aria-label="Previous hero">‹</button>
        <button class="bhd-hero-v3__arrow bhd-hero-v3__arrow--next" type="button" data-hero-next aria-label="Next hero">›</button>
      </div>

      <div class="bhd-hero-v3__dots" data-hero-dots aria-label="Hero slides"></div>

      <div class="bhd-hero-v3__benefits" aria-label="Best Hydrate benefits">
        <div class="bhd-hero-v3__benefit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2S5.5 9.2 5.5 14.2A6.5 6.5 0 0 0 18.5 14C18.5 9.2 12 2 12 2Z"/></svg>
          <span>Essential<br>Electrolytes</span>
        </div>
        <div class="bhd-hero-v3__benefit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6M10 2v5l-5 9a4 4 0 0 0 3.5 6h7a4 4 0 0 0 3.5-6l-5-9V2M8 15h8"/></svg>
          <span>Advanced<br>Hydration Science</span>
        </div>
        <div class="bhd-hero-v3__benefit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9M12 3c-3 3-4 6-4 9s1 6 4 9"/></svg>
          <span>Real World<br>Impact</span>
        </div>
        <div class="bhd-hero-v3__benefit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15h16M6 15a6 6 0 0 1 12 0M12 3v3M4.9 7.9l2.1 2.1M19.1 7.9 17 10"/></svg>
          <span>A Brighter<br>Tomorrow</span>
        </div>
      </div>
    </div>
  </div>

'''
          s = s[:tablet_start] + tablet_markup + s[mobile_start:]

          css_start = s.index('  @media screen and (max-width:1199px) and (min-width:750px) {')
          css_end = s.index('\n  @media screen and (max-width:749px) {', css_start)

          tablet_css = '''  @media screen and (max-width:1199px) and (min-width:750px) {
    #BhdHero-{{ section.id }} { padding:28px 34px; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__desktop { display:none; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet { display:block; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet-shell {
      background:linear-gradient(180deg,#ffffff 0%,#f4fbff 58%,#e8f6fc 100%);
      color:var(--hero-navy);
      padding:1.35rem 1.4rem 1rem;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__shared-head {
      text-align:center;
      padding:.1rem 1rem 1rem;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__eyebrow {
      font-size:.74rem;
      letter-spacing:.34em;
      font-weight:800;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__headline {
      margin-top:.22rem;
      font-size:clamp(2.2rem,5.2vw,4.1rem);
      line-height:.9;
      font-weight:900;
      color:var(--hero-blue);
      text-transform:uppercase;
      letter-spacing:-.035em;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__headline span {
      display:block;
      color:var(--hero-navy);
      font-size:.47em;
      letter-spacing:.01em;
      margin-bottom:.05em;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__tagline {
      margin-top:.34rem;
      font-size:clamp(1rem,2vw,1.45rem);
      font-weight:750;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__tagline em {
      font-style:italic;
      border-bottom:.16em solid #16bce7;
      padding:0 .08em;
    }

    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet-stage {
      position:relative;
      height:clamp(400px,50vw,565px);
      overflow:hidden;
      border-radius:20px;
      background:
        radial-gradient(circle at 50% 52%,rgba(255,255,255,.98) 0 19%,rgba(208,239,251,.78) 32%,rgba(208,239,251,0) 49%),
        linear-gradient(180deg,#dff2fb 0%,#cfeaf7 100%);
      box-shadow:inset 0 0 0 1px rgba(7,43,104,.08);
      isolation:isolate;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet-stage::after {
      content:"";
      position:absolute;
      z-index:1;
      left:23%;
      right:23%;
      bottom:2.5%;
      height:15%;
      border-radius:50%;
      background:radial-gradient(ellipse,rgba(13,113,180,.28) 0%,rgba(13,113,180,.07) 45%,rgba(13,113,180,0) 72%);
      filter:blur(2px);
    }

    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet-slide {
      position:absolute;
      inset:0;
      z-index:2;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:opacity .36s ease;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet-slide.is-active {
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__segment-card {
      position:absolute;
      top:0;
      bottom:0;
      width:40%;
      overflow:hidden;
      background:#d8eaf3;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__segment-card--left {
      left:0;
      border-radius:20px 70px 70px 20px;
      clip-path:polygon(0 0,100% 0,86% 100%,0 100%);
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__segment-card--right {
      right:0;
      border-radius:70px 20px 20px 70px;
      clip-path:polygon(14% 0,100% 0,100% 100%,0 100%);
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__segment-card img {
      width:100%;
      height:100%;
      object-fit:cover;
      transform:scale(1.24);
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet-slide:nth-child(1) .bhd-hero-v3__segment-card--left img { object-position:34% 45%; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet-slide:nth-child(1) .bhd-hero-v3__segment-card--right img { object-position:70% 44%; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet-slide:nth-child(2) .bhd-hero-v3__segment-card--left img { object-position:30% 44%; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet-slide:nth-child(2) .bhd-hero-v3__segment-card--right img { object-position:72% 45%; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__segment-card::after {
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(180deg,rgba(3,31,70,.03) 0%,rgba(3,31,70,0) 55%,rgba(3,31,70,.68) 100%);
      pointer-events:none;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__segment-copy {
      position:absolute;
      z-index:4;
      left:1.15rem;
      right:1.15rem;
      bottom:1.15rem;
      color:#fff;
      text-shadow:0 2px 10px rgba(0,20,55,.5);
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__segment-card--right .bhd-hero-v3__segment-copy { text-align:right; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__segment-copy strong {
      display:block;
      font-size:clamp(1.25rem,2.5vw,2rem);
      line-height:1;
      text-transform:uppercase;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__segment-copy span {
      display:block;
      margin-top:.28rem;
      font-size:clamp(.76rem,1.25vw,.96rem);
      line-height:1.15;
      font-weight:750;
    }

    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet-core {
      position:absolute;
      z-index:6;
      left:50%;
      top:51%;
      width:34%;
      max-width:385px;
      min-width:245px;
      aspect-ratio:1;
      transform:translate(-50%,-50%);
      pointer-events:none;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet-product {
      position:absolute;
      z-index:3;
      inset:9% 5% 2%;
      display:block;
      pointer-events:auto;
      filter:drop-shadow(0 18px 20px rgba(3,38,78,.28));
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet-product::before {
      content:"";
      position:absolute;
      z-index:-1;
      inset:5% -7% -2%;
      border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,.98) 0%,rgba(219,244,253,.9) 48%,rgba(219,244,253,0) 75%);
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__tablet-product img {
      width:100%;
      height:100%;
      object-fit:contain;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__nutrient {
      position:absolute;
      z-index:5;
      min-width:3.25rem;
      height:3.25rem;
      padding:0 .55rem;
      border:2px solid rgba(20,149,220,.46);
      border-radius:999px;
      background:rgba(255,255,255,.9);
      color:var(--hero-navy);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:clamp(.65rem,1.25vw,.95rem);
      font-weight:900;
      line-height:1;
      box-shadow:0 .35rem .9rem rgba(0,78,135,.14);
      backdrop-filter:blur(5px);
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__nutrient sup,
    #BhdHero-{{ section.id }} .bhd-hero-v3__nutrient sub { font-size:.7em; line-height:0; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__nutrient--na { left:-10%; top:12%; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__nutrient--k { right:-9%; top:16%; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__nutrient--cl { left:-13%; bottom:22%; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__nutrient--bicarb { right:-14%; bottom:25%; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__nutrient--glucose {
      left:50%;
      top:-4%;
      transform:translateX(-50%);
      min-width:auto;
      padding:0 .7rem;
    }

    #BhdHero-{{ section.id }} .bhd-hero-v3__arrow { z-index:10; width:3.3rem; height:3.3rem; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__arrow--prev { left:.7rem; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__arrow--next { right:.7rem; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__dots { margin:.72rem 0 .28rem; }
    #BhdHero-{{ section.id }} .bhd-hero-v3__benefits {
      margin-top:.42rem;
      padding:.9rem .25rem .12rem;
      border-top:1px solid rgba(7,43,104,.12);
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:.65rem;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__benefit {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:.45rem;
      min-width:0;
      text-align:left;
      color:var(--hero-navy);
      font-weight:800;
      font-size:clamp(.66rem,1.16vw,.86rem);
      line-height:1.05;
      text-transform:uppercase;
    }
    #BhdHero-{{ section.id }} .bhd-hero-v3__benefit svg {
      width:1.9rem;
      min-width:1.9rem;
      height:1.9rem;
      fill:none;
      stroke:currentColor;
      stroke-width:1.7;
    }
  }
'''
          s = s[:css_start] + tablet_css + s[css_end:]
          p.write_text(s)
          PY

          git config user.name 'swini16'
          git config user.email '59820522+swini16@users.noreply.github.com'
          git add sections/bhd-hero.liquid
          git commit -m 'Redesign tablet hero around product core'
          git push origin HEAD:main