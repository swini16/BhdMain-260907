name: Storefront Playwright validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: storefront-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke + robotic validation
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BASE_URL: https://besthydrate.com
      PRODUCT_PATH: /products/lemonade-best-hydrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@latest @axe-core/playwright@latest
          npx playwright install --with-deps chromium

      - name: Allow live Shopify sync after main push
        if: github.event_name == 'push'
        run: sleep 30

      - name: Run storefront Playwright validation
        run: npx playwright test --config=playwright.config.cjs

      - name: Prepare stable visual captures
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-current
          find test-results -type f -name 'visual-*.jpg' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "visual-current/$(basename "$f")"
          done
          echo 'bhd-visual-v2' > visual-current/baseline-version.txt
          test "$(find visual-current -maxdepth 1 -name 'visual-*.jpg' | wc -l)" -ge 10

      - name: Compare screenshots with last approved main run
        if: ${{ github.event_name == 'push' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          VISUAL_PIXEL_THRESHOLD: '0.12'
          VISUAL_MAX_DIFF_RATIO: '0.015'
          VISUAL_MAX_DIMENSION_DRIFT_RATIO: '0.02'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save sharp@latest pixelmatch@latest

          BASELINE_RUN_ID="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/storefront-playwright-smoke.yml/runs?branch=main&status=success&event=push&per_page=20"               --jq '.workflow_runs[] | select((.id|tostring) != env.GITHUB_RUN_ID) | .id'               | head -n 1
          )"

          if [ -z "$BASELINE_RUN_ID" ]; then
            echo "No prior successful main visual run exists. Bootstrapping baseline."
            exit 0
          fi

          ARTIFACT_ID="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN_ID/artifacts?per_page=100"               --jq '.artifacts[] | select(.name | startswith("visual-regression-")) | .id'               | head -n 1
          )"

          if [ -z "$ARTIFACT_ID" ]; then
            echo "Prior successful run has no visual-regression artifact. Bootstrapping baseline."
            exit 0
          fi

          mkdir -p /tmp/visual-baseline-extract visual-baseline visual-diff
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/visual-baseline.zip
          unzip -q /tmp/visual-baseline.zip -d /tmp/visual-baseline-extract

          BASELINE_VERSION="$(find /tmp/visual-baseline-extract -type f -name 'baseline-version.txt' -print -quit || true)"
          if [ -z "$BASELINE_VERSION" ] || [ "$(cat "$BASELINE_VERSION")" != "bhd-visual-v2" ]; then
            echo "Prior artifact uses an older visual-capture format. Bootstrapping bhd-visual-v2 baseline."
            exit 0
          fi

          find /tmp/visual-baseline-extract -type f -name 'visual-*.jpg' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "visual-baseline/$(basename "$f")"
          done

          node scripts/visual-regression-compare.mjs visual-baseline visual-current visual-diff

      - name: Upload visual regression evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            visual-current/
            visual-diff/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Triage real live validation failure
        if: ${{ failure() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE='Storefront QA live validation failure'
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          SHORT_SHA="${GITHUB_SHA:0:8}"

          FAILED_STEPS="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100"               --jq '[.jobs[].steps[]? | select(.conclusion=="failure") | .name] | unique | join(", ")'
          )"
          [ -n "$FAILED_STEPS" ] || FAILED_STEPS='Unknown step; inspect run summary'

          case "$FAILED_STEPS" in
            *"Compare screenshots with last approved main run"*)
              CATEGORY='Visual regression'
              NEXT='Review the visual-regression artifact and diff summary; confirm whether the appearance change is intended.'
              ;;
            *"Run storefront Playwright validation"*)
              CATEGORY='Live storefront functionality / layout / accessibility'
              NEXT='Open the Playwright report first; use the failed test name, screenshot and trace to isolate the page and breakpoint.'
              ;;
            *"Prepare stable visual captures"*)
              CATEGORY='Visual capture pipeline'
              NEXT='Inspect screenshot generation and test-results output before changing storefront code.'
              ;;
            *"Install Playwright"*|*"Set up Node"*|*"Checkout repository"*)
              CATEGORY='CI infrastructure'
              NEXT='Retry only after checking the failed setup step; storefront code may be healthy.'
              ;;
            *)
              CATEGORY='Validation pipeline'
              NEXT='Open the failed run and inspect the first failed step before changing production code.'
              ;;
          esac

          ARTIFACTS="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100"               --jq '.artifacts | if length == 0 then "None uploaded" else map("- [\(.name)](https://github.com/'"$GITHUB_REPOSITORY"'/actions/runs/'"$GITHUB_RUN_ID"'/artifacts/\(.id))") | join("\n") end'
          )"

          cat > /tmp/storefront-qa-issue.md <<EOF
          ## Current failure

          **Category:** $CATEGORY  
          **Trigger:** $GITHUB_EVENT_NAME  
          **Commit:** `$SHORT_SHA`  
          **Failed step(s):** $FAILED_STEPS

          **Next action:** $NEXT

          [Open workflow run]($RUN_URL)

          ### Evidence
          $ARTIFACTS

          ---
          This issue is maintained automatically. Repeated failures update it in place; the next successful live validation closes it.
          EOF

          ISSUE="$(
            gh issue list               --repo "$GITHUB_REPOSITORY"               --state open               --search "$TITLE in:title"               --json number,title               --jq '.[] | select(.title=="'"$TITLE"'") | .number'               | head -n 1
          )"

          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/storefront-qa-issue.md
            echo "Updated existing triage issue #$ISSUE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/storefront-qa-issue.md
          fi

      - name: Auto-close recovered live validation issue
        if: ${{ success() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE='Storefront QA live validation failure'
          ISSUE="$(
            gh issue list               --repo "$GITHUB_REPOSITORY"               --state open               --search "$TITLE in:title"               --json number,title               --jq '.[] | select(.title=="'"$TITLE"'") | .number'               | head -n 1
          )"

          if [ -z "$ISSUE" ]; then
            echo 'No open live-validation issue to close.'
            exit 0
          fi

          BODY="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          {
            printf '%s\n\n' "$BODY"
            echo '---'
            echo "**Recovered automatically:** $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "[Successful validation run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/storefront-qa-recovered.md

          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/storefront-qa-recovered.md
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
