name: Storefront Playwright validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: storefront-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke + robotic validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BASE_URL: https://besthydrate.com
      PRODUCT_PATH: /products/lemonade-best-hydrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@latest @axe-core/playwright@latest
          npx playwright install --with-deps chromium

      - name: Allow live Shopify sync after main push
        if: github.event_name == 'push'
        run: sleep 30

      - name: Run storefront Playwright validation
        run: npx playwright test --config=playwright.config.cjs

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
