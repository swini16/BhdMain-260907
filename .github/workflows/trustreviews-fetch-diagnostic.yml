name: TrustReviews fetch diagnostic

on:
  push:
    branches: [ci5-native-responsive-reviews]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public TrustReviews widget
        shell: bash
        run: |
          set -euo pipefail
          url='https://reviews.trustapps.co/_w/938e7cb7-8c69-47b7-976e-3082273b3445/8904882422044'
          curl -L --fail --silent --show-error --max-time 30 "$url" -o /tmp/trustreviews.html
          echo "bytes=$(wc -c < /tmp/trustreviews.html)"
          echo "review-body markers:"
          grep -n -m 5 -B 12 -A 45 'id="review-body"' /tmp/trustreviews.html || true
          echo "review names with context:"
          for needle in 'Leah' 'Matt Smith' 'PoozybGolfs' 'Andy' 'clay hines'; do
            echo "--- $needle ---"
            grep -in -m 1 -B 12 -A 35 "$needle" /tmp/trustreviews.html || true
          done
