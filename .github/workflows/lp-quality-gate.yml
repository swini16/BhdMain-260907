name: LP Quality Gate

on:
  pull_request:
    branches: [main]
    paths: ['**/*.liquid','assets/**','templates/**','config/**','.github/workflows/lp-quality-gate.yml']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  liquid-theme-check:
    name: Liquid / Shopify Theme Check
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: false }
      - run: gem install theme-check
      - name: Validate changed Liquid without legacy-theme noise
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          git diff --name-only "$BASE" HEAD -- '*.liquid' > /tmp/changed-liquid.txt || true
          NO_COLOR=1 theme-check . --fail-level error > /tmp/theme-check.txt 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          changed={x.strip() for x in Path('/tmp/changed-liquid.txt').read_text().splitlines() if x.strip()}
          text=Path('/tmp/theme-check.txt').read_text(errors='replace')
          bad=[]
          rx=re.compile(r'^([^:\n]+\.liquid):(\d+)(?::\d+)?:\s+error:', re.I|re.M)
          for m in rx.finditer(text):
              if m.group(1) in changed:
                  bad.append(m.group(0))
          print('Changed Liquid files:', ', '.join(sorted(changed)) or 'none')
          if bad:
              print('Theme Check errors in changed files:')
              print('\n'.join(bad))
              raise SystemExit(1)
          print('No Theme Check error-level offenses in changed Liquid files.')
          PY

  lp-contracts:
    name: LP UX / tracking contracts
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate conversion, responsive and analytics contracts
        shell: bash
        run: |
          set -euo pipefail
          f='snippets/bhd-lp-conversion-shell.liquid'; o='snippets/bhd-lp-conversion-open.liquid'; d='snippets/bhd-page-dispatch.liquid'
          l='snippets/bhd-page-lp-low-sugar.liquid'; r='snippets/bhd-page-lp-run-the-river-edmonton.liquid'; b='snippets/bhd-page-lp-bicarb-bonus.liquid'; t='snippets/bhd-lp-tracking.liquid'
          test -f "$f"; test -f "$o"; test -f "$d"; test -f "$l"; test -f "$r"; test -f "$b"; test -f "$t"
          grep -Fq "render 'bhd-lp-conversion-open'" "$d"
          grep -Fq "render 'bhd-lp-conversion-shell'" "$d"
          grep -Fq 'is_consumer_conversion_lp' "$d"
          grep -Fq 'show_lp_sales_close' "$d"
          grep -Fq "render 'bhd-page-lp-low-sugar'" "$d"
          grep -Fq "render 'bhd-page-lp-run-the-river-edmonton'" "$d"
          grep -Fq "render 'bhd-page-lp-bicarb-bonus'" "$d"
          grep -Fq 'is_dedicated_paid_lp' "$d"
          grep -Fq "render 'bhd-lp-tracking'" "$d"
          for excluded in 'lp-03-research-milestone' 'lp-06-clinical-hydration-context' 'lp-08-hydration-access' 'lp-02f-hydration-thats-not-too-sweet' 'lp-10-eps-half-marathon-edmonton' 'lp-10-run-the-river-edmonton' 'lp-11-nashville-heat' 'lp-12-bicarb-bonus'; do grep -Fq "$excluded" "$d"; done
          for x in 'data-bhd-lp-open' 'data-lp-cta="early"' 'data-lp-cta="low-sugar"' 'Shop Best Hydrate' 'Low sugar, on purpose.' 'Tastes great. Not too sweet.' '32 servings.' 'Free &amp; Fast Delivery.' '/products/lemonade-best-hydrate' '/products/lemonade-electrolyte-best-hydrate' '@media(max-width:749px)'; do grep -Fq "$x" "$o"; done
          for x in 'data-bhd-lp-close' 'data-lp-section="taste"' 'data-lp-section="why"' 'data-lp-section="cycle"' 'data-lp-section="compare"' 'data-lp-section="faq"' 'data-lp-section="offer"' 'data-lp-cta="final"' 'data-lp-cta="sticky"' 'Shop Best Hydrate' 'Free &amp; Fast Delivery' 'Tastes great. Not too sweet.' 'Low sugar, on purpose.' 'Zero sugar leaves helpful glucose out.' 'Traditional sports drinks bring a heavy sugar load.' 'Best Hydrate hits the hydration middle.' 'Glucose has a job.' 'Bicarb Bonus™' '/products/lemonade-best-hydrate' '/products/lemonade-electrolyte-best-hydrate' '@media(max-width:749px)'; do grep -Fq "$x" "$f"; done
          for x in 'LOW SUGAR, ON PURPOSE. NOT ZERO. NOT OVERLOADED.' 'data-lp-cta="early"' 'data-lp-cta="final"' 'data-lp-cta="sticky"' 'Tastes great. Not too sweet.' 'Zero sugar leaves helpful glucose out.' 'Traditional sports drinks bring a heavy sugar load.' 'Best Hydrate hits the hydration middle.' 'Glucose has a job.' 'Bicarb Bonus™' '/products/lemonade-best-hydrate' '/products/lemonade-electrolyte-best-hydrate'; do grep -Fq "$x" "$l"; done
          for x in 'Bicarb Bonus™ hydration, without the megadose.' 'data-lp-cta="early"' 'data-lp-cta="final"' 'data-lp-cta="sticky"' 'loading protocol' 'Bicarb Bonus™' '/products/lemonade-best-hydrate' '/products/lemonade-electrolyte-best-hydrate'; do grep -Fq "$x" "$b"; done
          for x in 'Finished the race. Build what comes next.' 'RECOVER → RESET → REPEAT' 'data-lp-cta="early"' 'data-lp-cta="final"' 'data-lp-cta="sticky"' 'Tastes great. Not too sweet.' 'Zero sugar leaves helpful glucose out.' 'Traditional sports drinks bring a heavy sugar load.' 'Best Hydrate hits the hydration middle.'; do grep -Fq "$x" "$r"; done
          ! grep -Fq 'Race tomorrow? Don’t reinvent hydration tonight.' "$r"
          for x in "window.amplitude.track(name, props)" "LP CTA Clicked" "LP Section Viewed" "event: dataLayerEvent" "lp_cta_clicked" "lp_section_viewed" "page_handle:" "lp_context:" "[data-lp-cta]" "[data-lp-section]"; do grep -Fq "$x" "$t"; done
          grep -Fq 'data-lp-section="open"' "$o"
          grep -Fq 'data-lp-cta="early-amazon"' "$r"
          grep -Fq 'data-lp-cta="final-amazon"' "$r"
          ! grep -Eq '<script[^>]+src=' "$f" "$o"
          ! grep -Eqi '(logo|jar|packaging).*(base64|data:image)' "$f" "$o"
      - name: JavaScript syntax smoke test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('snippets/bhd-lp-tracking.liquid').read_text(); s=re.findall(r'<script>(.*?)</script>',p,re.S); assert s
          js=re.sub(r"'\{\{.*?\}\}'", "'liquid-value'", s[-1], flags=re.S); Path('/tmp/lp.js').write_text(js)
          PY
          node --check /tmp/lp.js

  static-safety:
    name: LP static safety checks
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          ! grep -RInE '^(<<<<<<<|=======|>>>>>>>)' snippets sections templates assets --include='*.liquid' --include='*.js' --include='*.css'
          if grep -RIniE 'personalized|personalised|personalization|personalisation|individualized|individualised|proprietary|scientific testing|sweat testing|sweat sodium test|unique sweat profile|permanent personal number' snippets sections templates assets config layout locales --include='*.liquid' --include='*.json' --include='*.js' --include='*.css'; then
            echo "::error::Public storefront copy contains banned personalization/testing/proprietary language."
            exit 1
          fi
          if grep -RIniE '3771085|4148942|260202_DiannaProctor-1\.jpg|260202_DiannaProctor\.jpg' snippets sections templates assets config layout locales --include='*.liquid' --include='*.json' --include='*.js' --include='*.css'; then
            echo "::error::Rejected/low-quality storefront imagery was reintroduced."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          for file in ['snippets/bhd-lp-conversion-shell.liquid','snippets/bhd-lp-conversion-open.liquid','snippets/bhd-page-lp-low-sugar.liquid','snippets/bhd-page-lp-run-the-river-edmonton.liquid','snippets/bhd-page-lp-bicarb-bonus.liquid','snippets/bhd-lp-tracking.liquid']:
            p=Path(file).read_text()
            for t in ['section','div','article','details','style','script']:
              assert p.count('<'+t)-p.count('<'+t+'/') == p.count('</'+t+'>'), f'{file}: unbalanced {t}'
          shell=Path('snippets/bhd-lp-conversion-shell.liquid').read_text()
          opener=Path('snippets/bhd-lp-conversion-open.liquid').read_text()
          assert shell.count('data-lp-cta="final"') == 1
          assert opener.count('data-lp-cta="early"') == 1
          PY

  rendered-browser-smoke:
    name: Rendered browser smoke - isolated live baseline
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Create rendered smoke test
        run: |
          mkdir -p tests artifacts/lp-smoke
          cat > tests/lp-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          import fs from 'node:fs';
          const base='https://besthydrate.com';
          const paths=['/pages/lp-01-hydration-is-more-than-water','/pages/lp-02-six-ingredients','/pages/lp-04-hydration-follows-the-session','/pages/lp-02f-hydration-thats-not-too-sweet','/pages/lp-10-run-the-river-edmonton','/pages/lp-11-nashville-heat','/pages/lp-12-bicarb-bonus'];
          const devices=[['mobile',390,844],['tablet',820,1180],['desktop',1440,1000]];
          const browser=await chromium.launch(); let failures=[];
          const blocked=['google-analytics.com','googletagmanager.com','api.amplitude.com','api2.amplitude.com','amplitude.com','connect.facebook.net','facebook.com/tr','analytics.tiktok.com','hotjar.com','clarity.ms','segment.io','doubleclick.net','monorail-edge.shopifysvc.com'];
          for (const [device,width,height] of devices) for (const path of paths) {
            const context=await browser.newContext({viewport:{width,height},extraHTTPHeaders:{'DNT':'1','X-BHD-Automation':'1'}});
            await context.addCookies([{name:'bhd_automation',value:'1',domain:'besthydrate.com',path:'/',sameSite:'Lax'}]);
            await context.route('**/*',route=>blocked.some(x=>route.request().url().includes(x))?route.abort():route.continue());
            const page=await context.newPage(); const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
            const res=await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(1200);
            if(!res || res.status()>=400) failures.push(`${device} ${path}: HTTP ${res?.status()}`);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            if(overflow) failures.push(`${device} ${path}: horizontal overflow`);
            const h1=await page.locator('h1:visible').count(); if(h1!==1) failures.push(`${device} ${path}: visible H1 count ${h1}`);
            const links=page.locator('a:visible'); const n=Math.min(await links.count(),80);
            for(let i=0;i<n;i++){const href=await links.nth(i).getAttribute('href'); if(href==='#'||href==='') failures.push(`${device} ${path}: empty/# visible link`)}
            const tiny=await page.locator('a:visible,button:visible,summary:visible').evaluateAll(els=>els.filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0&&(r.height<40||r.width<40)}).length);
            if(tiny) failures.push(`${device} ${path}: ${tiny} undersized interactive target(s)`);
            const axe=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa']).analyze();
            const serious=axe.violations.filter(v=>['serious','critical'].includes(v.impact)); if(serious.length) failures.push(`${device} ${path}: ${serious.length} serious/critical accessibility violation type(s)`);
            if(errors.length) failures.push(`${device} ${path}: ${errors.slice(0,3).join(' | ')}`);
            await page.screenshot({path:`artifacts/lp-smoke/${device}-${path.split('/').pop()}.png`,fullPage:true});
            await context.close();
          }
          await browser.close(); fs.writeFileSync('artifacts/lp-smoke/results.txt',failures.length?failures.join('\n'):'PASS');
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          EOF
      - name: Run rendered smoke tests
        continue-on-error: true
        run: node tests/lp-smoke.mjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp-smoke-screenshots
          path: artifacts/lp-smoke
          retention-days: 14

  shopify-main-sync:
    name: Shopify MAIN sync
    if: github.event_name == 'push'
    needs: [liquid-theme-check, lp-contracts, static-safety]
    runs-on: ubuntu-latest
    env:
      SHOPIFY_FLAG_STORE: best-hydrate.myshopify.com
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN || secrets.SHOPIFY_THEME_ACCESS_TOKEN || secrets.SHOPIFY_ADMIN_API_TOKEN || secrets.SHOPIFY_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Push changed theme files to Shopify MAIN
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SHOPIFY_CLI_THEME_TOKEN:-}"
          npm install -g @shopify/cli@latest >/dev/null

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="HEAD^"
          fi

          git diff --name-only "$BEFORE" "$GITHUB_SHA" -- assets blocks config layout locales sections snippets templates > /tmp/theme-files-all.txt
          grep -Ev '(^|/)settings_data\.json$' /tmp/theme-files-all.txt > /tmp/theme-files.txt || true

          mapfile -t files < <(while IFS= read -r file; do
            [ -f "$file" ] && printf '%s\n' "$file"
          done < /tmp/theme-files.txt)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed deployable theme files."
            exit 0
          fi

          args=()
          for file in "${files[@]}"; do
            echo "Deploying $file"
            args+=(--only "$file")
          done

          shopify theme push \
            --path . \
            --store "$SHOPIFY_FLAG_STORE" \
            --password "$SHOPIFY_CLI_THEME_TOKEN" \
            --live \
            --allow-live \
            --nodelete \
            "${args[@]}" \
            --json

  post-merge-live-contract:
    name: Post-merge live LP conversion contract
    if: github.event_name == 'push'
    needs: [liquid-theme-check, lp-contracts, static-safety, shopify-main-sync]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          npm init -y >/dev/null 2>&1; npm install --save-dev playwright; npx playwright install --with-deps chromium
          mkdir -p tests
          cat > tests/lp-live-contract.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b=await chromium.launch(); const p=await b.newPage({viewport:{width:390,height:844}});
          const blocked=['google-analytics.com','googletagmanager.com','api.amplitude.com','api2.amplitude.com','amplitude.com','connect.facebook.net','facebook.com/tr','analytics.tiktok.com','hotjar.com','clarity.ms','segment.io','doubleclick.net','monorail-edge.shopifysvc.com','analytics.shopify.com','a.klaviyo.com','events-api.klaviyo.com'];
          await p.route('**/*',route=>blocked.some(x=>route.request().url().includes(x))?route.abort():route.continue());

          const home=await b.newPage({viewport:{width:1440,height:1000}});
          await home.route('**/*',route=>blocked.some(x=>route.request().url().includes(x))?route.abort():route.continue());
          await home.goto('https://besthydrate.com/?bhd_live_verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
          await home.waitForTimeout(1200);
          const diannaCard=home.locator('a[href="/pages/dianna-proctor"] img[alt*="Dianna Proctor"]').first();
          if(await diannaCard.count()<1) throw new Error('Homepage Dianna performance card not live');
          const diannaSrc=await diannaCard.getAttribute('src');
          if(!diannaSrc?.includes('DiannaP_2606-_color_balanced.jpg')) throw new Error('Homepage Dianna card is not using the approved high-resolution color-balanced asset');
          const scienceToggle=home.getByRole('button',{name:/Open Science menu/i}).first();
          await scienceToggle.click();
          const hydrationToggle=home.getByRole('button',{name:/Open Hydration Science submenu/i}).first();
          if(!(await hydrationToggle.isVisible())) throw new Error('Desktop mega-menu tier 2 toggle not live');
          await hydrationToggle.click();
          if(!(await home.getByRole('link',{name:'How Hydration Works'}).first().isVisible())) throw new Error('Desktop mega-menu tier 3 not live');

          const solutionsToggle=home.getByRole('button',{name:/Open Solutions menu/i}).first();
          await solutionsToggle.click();
          const performanceToggle=home.getByRole('button',{name:/Open Performance submenu/i}).first();
          if(!(await performanceToggle.isVisible())) throw new Error('Performance submenu not live');
          await performanceToggle.click();
          const athleticsLink=home.getByRole('link',{name:'Athletics',exact:true}).first();
          const diannaMenuLink=home.getByRole('link',{name:'Dianna Proctor',exact:true}).first();
          if(!(await athleticsLink.isVisible())) throw new Error('Performance > Athletics link not live');
          if(!(await diannaMenuLink.isVisible())) throw new Error('Performance > Dianna Proctor link not live');
          const menuText=await home.locator('header').innerText();
          if(/Athlete\s*&\s*Team|Athletes\s*&\s*Ambassadors|Athletes,\s*Teams\s*&\s*Leagues/i.test(menuText)) throw new Error('Redundant athlete labels are still visible in the mega menu');
          await home.close();

          for (const path of ['/pages/performance-hydration','/pages/heat-high-sweat','/pages/dianna-proctor']) {
            await p.goto('https://besthydrate.com'+path+'?bhd_live_verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await p.waitForTimeout(900);
            const body=(await p.locator('body').innerText()).toLowerCase();
            if(/personalized|personalised|personalization|personalisation|individualized|individualised|proprietary|scientific testing|sweat testing|sweat sodium test|unique sweat profile/.test(body)) throw new Error(path+': banned personalization/testing/proprietary copy is live');
            const html=await p.content();
            if(/3771085|4148942|260202_DiannaProctor-1\.jpg|260202_DiannaProctor\.jpg/.test(html)) throw new Error(path+': rejected/low-quality imagery is live');
          }

          await p.goto('https://besthydrate.com/pages/lp-01-hydration-is-more-than-water?utm_source=qa_automation&utm_medium=playwright&utm_campaign=lp_live_contract',{waitUntil:'domcontentloaded',timeout:45000});
          await p.waitForTimeout(1500);
          const opener=p.locator('[data-bhd-lp-open]'); if(await opener.count()!==1) throw new Error('Early LP conversion bridge not live');
          const early=p.locator('[data-lp-cta="early"]'); if(await early.count()!==1) throw new Error('Early LP CTA missing');
          const earlyHref=await early.getAttribute('href'); if(!earlyHref?.includes('/products/')) throw new Error('Early CTA does not target product');
          const shell=p.locator('[data-bhd-lp-close]'); if(await shell.count()!==1) throw new Error('LP conversion shell not live');
          const cta=p.locator('[data-lp-cta="final"]'); if(await cta.count()!==1) throw new Error('Final LP CTA missing');
          const href=await cta.getAttribute('href'); if(!href?.includes('/products/')) throw new Error('Final CTA does not target product');
          await cta.scrollIntoViewIfNeeded(); if(!(await cta.isVisible())) throw new Error('Final CTA not visible');

          for (const path of ['/pages/lp-02f-hydration-thats-not-too-sweet','/pages/lp-10-run-the-river-edmonton','/pages/lp-12-bicarb-bonus']) {
            await p.goto('https://besthydrate.com'+path+'?utm_source=qa_automation&utm_medium=playwright&utm_campaign=lp_live_contract',{waitUntil:'domcontentloaded',timeout:45000});
            await p.waitForTimeout(1200);
            const dedicatedEarly=p.locator('[data-lp-cta="early"]');
            const dedicatedFinal=p.locator('[data-lp-cta="final"]');
            if(await dedicatedEarly.count()!==1) throw new Error(path+': dedicated early CTA missing');
            if(await dedicatedFinal.count()!==1) throw new Error(path+': dedicated final CTA missing');
            if(await p.locator('.bhd-guide-variants').count()) throw new Error(path+': generic guide variants leaked into dedicated paid LP');
            const finalHref=await dedicatedFinal.getAttribute('href');
            if(!finalHref?.includes('/products/')) throw new Error(path+': final CTA does not target product');

            await p.evaluate(() => {
              window.dataLayer = [];
              const early = document.querySelector('[data-lp-cta="early"]');
              early?.addEventListener('click', (event) => event.preventDefault(), { once: true });
            });
            await dedicatedEarly.click();
            const tracked = await p.evaluate(() =>
              window.dataLayer.some((entry) => entry.event === 'lp_cta_clicked' && entry.cta === 'early')
            );
            if(!tracked) throw new Error(path+': early CTA did not emit lp_cta_clicked');
          }

          await b.close();
          EOF
          node tests/lp-live-contract.mjs

  notify-production:
    name: Telegram production status
    if: ${{ always() && github.event_name == 'push' }}
    needs: [liquid-theme-check, lp-contracts, static-safety, rendered-browser-smoke, post-merge-live-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram after eHP live verification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          LIQUID_RESULT: ${{ needs['liquid-theme-check'].result }}
          CONTRACT_RESULT: ${{ needs['lp-contracts'].result }}
          SAFETY_RESULT: ${{ needs['static-safety'].result }}
          BROWSER_RESULT: ${{ needs['rendered-browser-smoke'].result }}
          LIVE_RESULT: ${{ needs['post-merge-live-contract'].result }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          test -n "${TELEGRAM_CHAT_ID:-}"

          overall="success"
          for result in "$LIQUID_RESULT" "$CONTRACT_RESULT" "$SAFETY_RESULT" "$BROWSER_RESULT" "$LIVE_RESULT"; do
            [ "$result" = "success" ] || overall="failure"
          done

          short="${GITHUB_SHA:0:8}"
          pr="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)"
          ref="$short"
          pr_url=""
          chat_url=""
          chat_name="⚠️ CONVERSATION TITLE UNKNOWN"
          pr_title=""

          if [ -n "$pr" ]; then
            ref="PR #$pr • $short"
            pr_url="https://github.com/$GITHUB_REPOSITORY/pull/$pr"
            pr_json="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" 2>/dev/null || true)"
            body="$(printf '%s' "$pr_json" | jq -r '.body // ""' 2>/dev/null || true)"
            pr_title="$(printf '%s' "$pr_json" | jq -r '.title // ""' 2>/dev/null || true)"
            body_chat="$(printf '%s\n' "$body" | sed -nE 's#^[[:space:]]*ChatGPT-Chat:[[:space:]]*(https://chatgpt\.com/c/[A-Za-z0-9_-]{20,128})[[:space:]]*$#\1#p' | head -n1)"
            body_chat_id="$(printf '%s\n' "$body" | sed -nE 's#^[[:space:]]*ChatGPT-Chat-ID:[[:space:]]*([A-Za-z0-9_-]{20,128})[[:space:]]*$#\1#p' | head -n1)"
            body_chat_name="$(printf '%s\n' "$body" | sed -nE 's#^[[:space:]]*ChatGPT-Chat-Name:[[:space:]]*(.+[^[:space:]])[[:space:]]*$#\1#p' | head -n1 | cut -c1-120)"
            if [ -z "$body_chat_name" ]; then
              body_chat_name="$(printf '%s\n' "$body" | sed -nE 's#^[[:space:]]*ChatGPT-Conversation-Title:[[:space:]]*(.+[^[:space:]])[[:space:]]*$#\1#p' | head -n1 | cut -c1-120)"
            fi
            [ -n "$body_chat_name" ] && chat_name="$body_chat_name"
            if [ -n "$body_chat" ]; then chat_url="$body_chat";
            elif [ -n "$body_chat_id" ]; then chat_url="https://chatgpt.com/c/$body_chat_id";
            fi
          fi

          if [ "$overall" = "success" ]; then
            text="🟢 eHP LIVE • Chat: $chat_name • $ref • verified"
          else
            text="🔴 eHP LIVE VERIFY FAILED • Chat: $chat_name • $ref"
          fi
          if [ -n "$pr_title" ]; then text="$(printf '%s\n%s' "$text" "Task: $pr_title")"; fi
          if [ -n "$pr_url" ]; then text="$(printf '%s\n%s' "$text" "$pr_url")"; fi
          if [ -n "$chat_url" ]; then text="$(printf '%s\n%s' "$text" "ChatGPT: $chat_url")"; fi
          text="$(printf '%s\n%s' "$text" "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"

          response="$(curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}")"
          test "$(printf '%s' "$response" | jq -r '.ok // false')" = "true"
          echo "eHP Telegram notification acknowledged by Telegram."
