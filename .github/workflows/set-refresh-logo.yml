name: Set Refresh logo

on:
  push:
    branches:
      - hybrid
    paths:
      - '.github/workflows/set-refresh-logo.yml'

permissions:
  contents: write

jobs:
  set-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hybrid
        uses: actions/checkout@v4
        with:
          ref: hybrid
          fetch-depth: 0

      - name: Set Best Hydrate logo
        shell: bash
        run: |
          python - <<'PY'
          import json
          path = 'config/settings_data.json'
          with open(path, 'r', encoding='utf-8') as f:
              data = json.load(f)
          data['current']['logo'] = 'shopify://shop_images/LOGOClear_2.png'
          data['current']['logo_width'] = 140
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, separators=(',', ':'))
          PY
          rm -f .github/workflows/set-refresh-logo.yml

      - name: Commit logo setting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Set Best Hydrate logo in Refresh'
          git push origin HEAD:hybrid
