name: Canonicalize ChatGPT PR attribution

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: chat-title-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  canonicalize:
    name: Best-effort conversation attribution
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - name: Checkout trusted attribution rules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Canonicalize PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set +e
          attribution="$(python3 .github/scripts/chat_title_attribution.py 2>/dev/null || true)"
          title="$(printf '%s' "$attribution" | jq -r '.title // ""' 2>/dev/null || true)"
          [ -n "$title" ] || { echo "::notice::No plausible conversation title yet; leaving PR unchanged."; exit 0; }

          body="${PR_BODY:-}"
          if printf '%s\n' "$body" | grep -qiE '^[[:space:]]*ChatGPT-Conversation-Title:[[:space:]]*[^[:space:]]'; then
            echo "::notice::Canonical conversation title already present."
            exit 0
          fi

          if printf '%s\n' "$body" | grep -qiE '^[[:space:]]*ChatGPT-Conversation-Title:[[:space:]]*$'; then
            body="$(BODY="$body" TITLE="$title" python3 -c 'import os,re; b=os.environ.get("BODY",""); t=os.environ["TITLE"]; print(re.sub(r"(?im)^[ 	]*ChatGPT-Conversation-Title:[ 	]*$", "ChatGPT-Conversation-Title: "+t, b, count=1))')"
          else
            body="$(printf '%s\n\nChatGPT-Conversation-Title: %s\n' "$body" "$title")"
          fi

          if printf '%s\n' "$body" | grep -qiE '^[[:space:]]*ChatGPT-Conversation-Title-Source:'; then
            body="$(BODY="$body" python3 -c 'import os,re; b=os.environ.get("BODY",""); print(re.sub(r"(?im)^[ 	]*ChatGPT-Conversation-Title-Source:.*$", "ChatGPT-Conversation-Title-Source: canonicalized-at-open", b, count=1))')"
          else
            body="$(printf '%s\nChatGPT-Conversation-Title-Source: canonicalized-at-open\n' "$body")"
          fi

          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" || {
            echo "::warning::Attribution writeback unavailable; PR/CI/deploy continue normally."
            exit 0
          }

          verify="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null || true)"
          if ! printf '%s\n' "$verify" | grep -Fq "ChatGPT-Conversation-Title: $title"; then
            echo "::warning::Attribution writeback could not be verified; continuing without blocking."
            exit 0
          fi
          echo "Canonical ChatGPT conversation title stamped: $title"
