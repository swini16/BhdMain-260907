name: Media public release verification
on:
  push:
    tags: ['ehp-media-verify-*']
permissions:
  contents: read
jobs:
  public-media:
    name: Published Folio and CBC desktop/mobile assertions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://besthydrate.com
      MEDIA_PUBLIC_CHECK: '1'
      EXPECTED_LIVE_THEME_ID: '182996762908'
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag points to current main
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save @playwright/test@latest
      - name: Check both real routes with unchanged content assertions
        run: npx playwright test --config=playwright.config.cjs tests/playwright/media-pages.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-media-${{ github.sha }}
          path: |
            artifacts/media-review/
            test-results/
          retention-days: 14
