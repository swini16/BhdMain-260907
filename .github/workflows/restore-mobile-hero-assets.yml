name: Restore mobile hero assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-mobile-hero-assets.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified hero binaries and make hero same-origin
        shell: bash
        run: |
          set -euo pipefail
          git checkout 78467ba2e78c69c32b76252218588887360d2c0b -- \
            assets/hero-mobile-performance.webp \
            assets/hero-mobile-daily.webp \
            assets/hero-mobile-medical.webp \
            assets/hero-mobile-humanitarian.webp

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('sections/bhd-hero.liquid')
          s = p.read_text()
          names = ['performance', 'daily', 'medical', 'humanitarian']
          for name in names:
              s = re.sub(
                  r'src="https://cdn\.jsdelivr\.net/gh/swini16/BhdMain-260907@[^\"]+/assets/hero-mobile-' + name + r'\.webp"',
                  'src="{{ \'hero-mobile-' + name + '.webp\' | asset_url }}"',
                  s,
              )
              s = re.sub(
                  r'src="https://raw\.githubusercontent\.com/swini16/BhdMain-260907/[^\"]+/assets/hero-mobile-' + name + r'\.webp(?:\?[^\"]*)?"',
                  'src="{{ \'hero-mobile-' + name + '.webp\' | asset_url }}"',
                  s,
              )
          s = s.replace(' referrerpolicy="no-referrer"', '')
          p.write_text(s)
          PY

          rm -f assets/hero-mobile-performance.jpg
          rm -f snippets/bhd-hero-performance-a.liquid

          git config user.name "Best Hydrate Theme Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Restore mobile hero assets to Shopify CDN"
          git push origin HEAD:main
