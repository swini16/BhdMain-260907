name: Shopify PR preview gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: shopify-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-gate:
    name: Shopify preview + Playwright gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHOPIFY_FLAG_STORE: best-hydrate.myshopify.com
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN || secrets.SHOPIFY_THEME_ACCESS_TOKEN || secrets.SHOPIFY_ADMIN_API_TOKEN || secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_FLAG_FORCE: '1'
      BASE_URL: https://besthydrate.com
      PRODUCT_PATH: /products/lemonade-best-hydrate
      CRITICAL_HOTFIX: ${{ contains(github.event.pull_request.labels.*.name, 'critical-hotfix') }}

    steps:
      - name: Checkout proposed PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ChatGPT conversation attribution
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          attribution="$(python3 .github/scripts/chat_title_attribution.py)"
          title="$(printf '%s' "$attribution" | jq -r '.title // ""')"
          rule="$(printf '%s' "$attribution" | jq -r '.rule // "none"')"
          if [ -n "$title" ]; then
            echo "ChatGPT conversation attribution candidate: $title [$rule]"
          else
            echo "::warning::No usable ChatGPT conversation title candidate found; Telegram may show UNKNOWN."
          fi

      - name: Detect Shopify preview scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/pr-changed-files.txt

          if [[ "${{ github.event.pull_request.title }}" == "[CI1]"* ]]; then
            echo "ci1=true" >> "$GITHUB_OUTPUT"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI1 selected: run fast static sanity and skip rendered Shopify preview."
          elif grep -Eq '^(assets/|blocks/|config/|layout/|locales/|sections/|snippets/|templates/|tests/playwright/|playwright\.config\.cjs$|\.github/workflows/shopify-pr-preview-gate\.yml$)' /tmp/pr-changed-files.txt; then
            echo "ci1=false" >> "$GITHUB_OUTPUT"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Relevant Shopify/theme/QA changes detected. Running full rendered preview gate."
          else
            echo "ci1=false" >> "$GITHUB_OUTPUT"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Shopify/theme/QA changes detected. Required gate reports success without creating preview themes."
          fi

      - name: CI1 static sanity gate
        if: steps.scope.outputs.ci1 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git diff --check "$BASE" "$HEAD"
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=subprocess.check_output(["git","diff","--name-only",base,head], text=True).splitlines()
          for name in changed:
              p=pathlib.Path(name)
              if not p.exists() or not p.is_file():
                  continue
              text=p.read_text(errors="replace")
              if re.search(r"(?m)^(<<<<<<<|=======|>>>>>>>)", text):
                  raise SystemExit(f"{name}: merge-conflict marker")
              if name.endswith(".json"):
                  # Shopify JSON templates can contain a leading /* ... */ generated-file comment.
                  payload=re.sub(r"^\ufeff?\s*/\*.*?\*/\s*", "", text, count=1, flags=re.S)
                  json.loads(payload)
          print(f"CI1 static sanity passed for {len(changed)} changed files")
          PY

      - name: Block banned personalization copy and rejected imagery
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE 'personalized|personalised|personalization|personalisation|individualized|individualised|proprietary|scientific testing|sweat testing|sweat sodium test|unique sweat profile|permanent personal number' snippets sections templates assets config layout locales --include='*.liquid' --include='*.json' --include='*.js' --include='*.css'; then
            echo "::error::Public storefront contains banned personalization/testing/proprietary language."
            exit 1
          fi
          if grep -RIniE '3771085|4148942|260202_DiannaProctor-1\.jpg|260202_DiannaProctor\.jpg' snippets sections templates assets config layout locales --include='*.liquid' --include='*.json' --include='*.js' --include='*.css'; then
            echo "::error::Rejected or low-quality storefront imagery was reintroduced."
            exit 1
          fi

      - name: Verify Shopify preview credential
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SHOPIFY_CLI_THEME_TOKEN:-}" ]; then
            echo "::error::Missing Shopify theme credential. Add SHOPIFY_CLI_THEME_TOKEN as an Actions repository secret."
            exit 1
          fi

      - name: Set up Node
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Shopify CLI and Playwright
        if: steps.scope.outputs.relevant == 'true'
        run: |
          npm install --no-save @shopify/cli@latest @playwright/test@latest @axe-core/playwright@latest
          npx playwright install --with-deps chromium

      - name: Build proposed and baseline theme packages
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bhd-theme /tmp/bhd-theme-base artifacts

          for dir in assets blocks config layout locales sections snippets templates; do
            if [ -d "$dir" ]; then cp -R "$dir" /tmp/bhd-theme/; fi
          done

          git worktree add --detach /tmp/bhd-base "${{ github.event.pull_request.base.sha }}"
          for dir in assets blocks config layout locales sections snippets templates; do
            if [ -d "/tmp/bhd-base/$dir" ]; then cp -R "/tmp/bhd-base/$dir" /tmp/bhd-theme-base/; fi
          done

          test -f /tmp/bhd-theme/layout/theme.liquid
          test -f /tmp/bhd-theme/config/settings_schema.json
          test -f /tmp/bhd-theme-base/layout/theme.liquid
          test -f /tmp/bhd-theme-base/config/settings_schema.json

      - name: Create rendered baseline development theme
        if: steps.scope.outputs.relevant == 'true'
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          DEV_CONTEXT="pr-${{ github.event.pull_request.number }}-base"

          npx shopify theme push \
            --path /tmp/bhd-theme-base \
            --store "$SHOPIFY_FLAG_STORE" \
            --password "$SHOPIFY_CLI_THEME_TOKEN" \
            --development \
            --development-context "$DEV_CONTEXT" \
            --json > /tmp/shopify-baseline.json

          cat /tmp/shopify-baseline.json
          cp /tmp/shopify-baseline.json artifacts/shopify-baseline.json

          THEME_ID="$(jq -er '.theme.id | tostring' /tmp/shopify-baseline.json)"
          ROLE="$(jq -er '.theme.role' /tmp/shopify-baseline.json)"

          echo "theme_id=$THEME_ID" >> "$GITHUB_OUTPUT"
          echo "BASELINE_PREVIEW_THEME_ID=$THEME_ID" >> "$GITHUB_ENV"

          if [ "$ROLE" != "development" ]; then
            echo "::error::Expected baseline development theme, got role=$ROLE"
            exit 1
          fi

      - name: Create proposed Shopify development theme
        if: steps.scope.outputs.relevant == 'true'
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          DEV_CONTEXT="pr-${{ github.event.pull_request.number }}-proposed"

          npx shopify theme push \
            --path /tmp/bhd-theme \
            --store "$SHOPIFY_FLAG_STORE" \
            --password "$SHOPIFY_CLI_THEME_TOKEN" \
            --development \
            --development-context "$DEV_CONTEXT" \
            --json > /tmp/shopify-preview.json

          cat /tmp/shopify-preview.json
          cp /tmp/shopify-preview.json artifacts/shopify-preview.json

          THEME_ID="$(jq -er '.theme.id | tostring' /tmp/shopify-preview.json)"
          ROLE="$(jq -er '.theme.role' /tmp/shopify-preview.json)"

          echo "theme_id=$THEME_ID" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_THEME_ID=$THEME_ID" >> "$GITHUB_ENV"

          if [ "$ROLE" != "development" ]; then
            echo "::error::Expected proposed development theme, got role=$ROLE"
            exit 1
          fi

          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/pr-changed-files.txt

          if grep -Eq '^(assets/(constants|cart|quick-add-bulk|quantity-popover|price-per-item|quick-order-list)\.js|snippets/cart-drawer\.liquid|layout/theme\.liquid)$' /tmp/pr-changed-files.txt; then
            echo "IGNORE_PREVIEW_BASELINE_JS=0" >> "$GITHUB_ENV"
          else
            echo "IGNORE_PREVIEW_BASELINE_JS=1" >> "$GITHUB_ENV"
          fi

          jq -r '.theme.errors // {} | keys[]' /tmp/shopify-preview.json > /tmp/theme-error-files.txt || true
          if [ -s /tmp/theme-error-files.txt ]; then
            echo "::warning::Shopify reported pre-existing upload errors:"
            cat /tmp/theme-error-files.txt
            while IFS= read -r error_file; do
              if grep -Fxq "$error_file" /tmp/pr-changed-files.txt; then
                echo "::error::Changed file failed Shopify upload: $error_file"
                exit 1
              fi
            done < /tmp/theme-error-files.txt
          fi

      - name: Verify both rendered themes respond
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for THEME_ID in "$BASELINE_PREVIEW_THEME_ID" "$PREVIEW_THEME_ID"; do
            URL="https://besthydrate.com/?preview_theme_id=${THEME_ID}&utm_source=qa_automation&utm_medium=playwright&utm_campaign=pr_preview"
            ready=0
            for attempt in {1..12}; do
              code="$(curl -L -sS -o /tmp/preview-home.html -w '%{http_code}' "$URL" || true)"
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ] && grep -qi '<html' /tmp/preview-home.html; then
                ready=1
                break
              fi
              sleep 5
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::Shopify rendered theme $THEME_ID did not become ready."
              exit 1
            fi
          done

      - name: Run Playwright against proposed and baseline previews
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CRITICAL_HOTFIX" = "true" ]; then
            echo "::notice::critical-hotfix: running targeted product validation only."
            npx playwright test               --config=playwright.config.cjs               tests/playwright/robotic-validation.spec.cjs               tests/playwright/storefront-smoke.spec.cjs               --grep "Lemonade product page passes robotic validation|Lemonade product can add to cart and open checkout"
          else
            npx playwright test --config=playwright.config.cjs
          fi

      - name: Upload preview QA diagnostics
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: shopify-pr-preview-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            artifacts/shopify-preview.json
            artifacts/shopify-baseline.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete proposed development preview
        if: ${{ always() && steps.scope.outputs.relevant == 'true' && steps.preview.outputs.theme_id != '' }}
        shell: bash
        run: |
          npx shopify theme delete \
            --store "$SHOPIFY_FLAG_STORE" \
            --password "$SHOPIFY_CLI_THEME_TOKEN" \
            --theme "${{ steps.preview.outputs.theme_id }}" \
            --force

      - name: Delete baseline development preview
        if: ${{ always() && steps.scope.outputs.relevant == 'true' && steps.baseline.outputs.theme_id != '' }}
        shell: bash
        run: |
          npx shopify theme delete \
            --store "$SHOPIFY_FLAG_STORE" \
            --password "$SHOPIFY_CLI_THEME_TOKEN" \
            --theme "${{ steps.baseline.outputs.theme_id }}" \
            --force
