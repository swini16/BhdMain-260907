name: Shopify PR preview gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: shopify-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-gate:
    name: Shopify preview + Playwright gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SHOPIFY_FLAG_STORE: best-hydrate.myshopify.com
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN || secrets.SHOPIFY_THEME_ACCESS_TOKEN || secrets.SHOPIFY_ADMIN_API_TOKEN || secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_FLAG_FORCE: '1'
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
      BASE_URL: https://besthydrate.com
      PRODUCT_PATH: /products/lemonade-best-hydrate

    steps:
      - name: Checkout proposed PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ChatGPT conversation attribution
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          attribution="$(python3 .github/scripts/chat_title_attribution.py)"
          title="$(printf '%s' "$attribution" | jq -r '.title // ""')"
          rule="$(printf '%s' "$attribution" | jq -r '.rule // "none"')"
          if [ -n "$title" ]; then
            echo "ChatGPT conversation attribution candidate: $title [$rule]"
          else
            echo "::warning::No usable ChatGPT conversation title candidate found; Telegram may show UNKNOWN."
          fi

      - name: Detect preview scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$BASE" "$HEAD" > /tmp/pr-changed-files.txt

          if [[ "${{ github.head_ref }}" == ci0-* || "${{ github.event.pull_request.title }}" == "CI0:"* || "${{ github.event.pull_request.title }}" == "[CI0]"* ]]; then
            echo "ci0=true" >> "$GITHUB_OUTPUT"
            echo "ci1=false" >> "$GITHUB_OUTPUT"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "preview_paths=/" >> "$GITHUB_OUTPUT"
            echo "expect_nav=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI0 selected: all preview/QA gates bypassed."
            exit 0
          fi
          echo "ci0=false" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event.pull_request.title }}" == "[CI1]"* ]]; then
            echo "ci1=true" >> "$GITHUB_OUTPUT"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "preview_paths=/" >> "$GITHUB_OUTPUT"
            echo "expect_nav=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI1 selected: static sanity only."
            exit 0
          fi

          if ! grep -Eq '^(assets/|blocks/|config/|layout/|locales/|sections/|snippets/|templates/|tests/playwright/|playwright\.config\.cjs$|scripts/check-responsive-surfaces\.mjs$|\.github/workflows/shopify-pr-preview-gate\.yml$)' /tmp/pr-changed-files.txt; then
            echo "ci1=false" >> "$GITHUB_OUTPUT"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "preview_paths=/" >> "$GITHUB_OUTPUT"
            echo "expect_nav=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No storefront/theme changes. Required gate exits after static sanity."
            exit 0
          fi

          echo "ci1=false" >> "$GITHUB_OUTPUT"
          echo "relevant=true" >> "$GITHUB_OUTPUT"

          python3 - <<'PY' > /tmp/preview-scope.env
          from pathlib import Path
          files=[line.strip() for line in Path('/tmp/pr-changed-files.txt').read_text().splitlines() if line.strip()]
          paths=['/']
          nav=False
          media=any(any(n in f for n in ['bhd-page-media-alliance', 'bhd-publication-ribbon', 'bhd-page-press', 'media-pages.spec']) for f in files)
          if media:
              paths += ['/pages/folio-hydration-feature', '/pages/cbc-edmonton-am', '/pages/press']

          def any_match(*needles):
              return any(any(n in f for n in needles) for f in files)

          if any_match('bhd-header', 'bhd-menu', 'bhd-page-breadcrumbs', 'bhd-footer-nav', 'header-group.json'):
              nav=True
              paths += [
                  '/pages/hydration-science',
                  '/pages/performance-hydration',
                  '/pages/partnerships',
                  '/pages/investor-relations',
              ]

          if any_match('main-product.liquid', 'bhd-page-product-details', 'bhd-page-directions', 'bhd-page-faq', 'templates/product'):
              paths += ['/products/lemonade-best-hydrate']

          if any_match('bhd-phase-page', 'bhd-page-performance-hydration', 'bhd-page-endurance', 'bhd-page-heat-high-sweat', 'bhd-page-recovery', 'bhd-how-to-use'):
              paths += ['/pages/prep', '/pages/perform', '/pages/recover', '/pages/performance-hydration']

          if any_match('research-publications', 'current-research', 'research-partners', 'research-impact', 'clinical-development', 'clinical-program', 'pilot-studies', 'healthcare-applications'):
              paths += ['/pages/research-publications', '/pages/clinical-development']

          if any_match('bhd-page-partnerships', 'research-partnerships', 'retail-distribution', 'humanitarian-partnerships'):
              paths += ['/pages/partnerships']

          if any_match('investor-relations', 'investor-overview', 'corporate-information', 'investor-contact', 'bhd-blog-intro'):
              paths += ['/pages/investor-relations', '/blogs/news']

          if any(f.startswith(('layout/','assets/','config/')) for f in files):
              paths += ['/products/lemonade-best-hydrate']

          seen=[]
          for p in paths:
              if p not in seen:
                  seen.append(p)

          # Keep the required gate bounded. Exhaustive full-site QA runs separately
          # as an advisory workflow and must not serialize every deploy.
          seen=seen[:8]
          print('preview_paths=' + ','.join(seen))
          print('expect_nav=' + ('true' if nav else 'false'))
          print('media=' + ('true' if media else 'false'))
          print('purchase=' + ('true' if any('bhd-backorder' in f or 'purchase-flow' in f for f in files) else 'false'))
          PY

          cat /tmp/preview-scope.env >> "$GITHUB_OUTPUT"
          echo "::notice::Targeted preview paths: $(grep '^preview_paths=' /tmp/preview-scope.env | cut -d= -f2-)"

      - name: Fast static sanity
        if: steps.scope.outputs.ci0 != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git diff --check "$BASE" "$HEAD"
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=subprocess.check_output(["git","diff","--name-only",base,head], text=True).splitlines()
          for name in changed:
              p=pathlib.Path(name)
              if not p.exists() or not p.is_file():
                  continue
              text=p.read_text(errors="replace")
              if re.search(r"(?m)^(<<<<<<<|=======|>>>>>>>)", text):
                  raise SystemExit(f"{name}: merge-conflict marker")
              if name.endswith(".json"):
                  payload=re.sub(r"^\ufeff?\s*/\*.*?\*/\s*", "", text, count=1, flags=re.S)
                  json.loads(payload)
          print(f"Static sanity passed for {len(changed)} changed files")
          PY

      - name: Block banned personalization copy and rejected imagery
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE 'personalized|personalised|personalization|personalisation|individualized|individualised|proprietary|scientific testing|sweat testing|sweat sodium test|unique sweat profile|permanent personal number' snippets sections templates assets config layout locales --include='*.liquid' --include='*.json' --include='*.js' --include='*.css'; then
            echo "::error::Public storefront contains banned personalization/testing/proprietary language."
            exit 1
          fi
          if grep -RIniE '3771085|4148942|260202_DiannaProctor-1\.jpg|260202_DiannaProctor\.jpg' snippets sections templates assets config layout locales --include='*.liquid' --include='*.json' --include='*.js' --include='*.css'; then
            echo "::error::Rejected or low-quality storefront imagery was reintroduced."
            exit 1
          fi

      - name: Verify Shopify preview credential
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SHOPIFY_CLI_THEME_TOKEN:-}" ]; then
            echo "::error::Missing Shopify theme credential."
            exit 1
          fi

      - name: Set up Node
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install preview test dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: |
          npm install --no-save @shopify/cli@latest @playwright/test@latest
          npx playwright install --with-deps chromium

      - name: Verify installed Chrome sandbox before staging
        if: steps.scope.outputs.relevant == 'true'
        run: |
          google-chrome --version
          node - <<'JS'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ channel: 'chrome', chromiumSandbox: true });
            console.log('Sandbox-enabled Chrome:', browser.version());
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          JS

      - name: Build proposed theme package
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bhd-theme artifacts
          for dir in assets blocks config layout locales sections snippets templates; do
            if [ -d "$dir" ]; then cp -R "$dir" /tmp/bhd-theme/; fi
          done
          test -f /tmp/bhd-theme/layout/theme.liquid
          test -f /tmp/bhd-theme/config/settings_schema.json

      - name: Build source-bound media alternate-template fixtures
        if: steps.scope.outputs.media == 'true'
        run: |
          python3 scripts/build-media-preview-fixtures.py /tmp/bhd-theme
          echo "MEDIA_PREVIEW_FIXTURES=1" >> "$GITHUB_ENV"

      - name: Sync and validate TrustReviews review feed
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync-trustreviews.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('assets/bhd-reviews.json').read_text(encoding='utf-8'))
          reviews = payload.get('reviews', [])
          assert payload.get('source') == 'TrustReviews'
          assert payload.get('product_id') == '8904882422044'
          assert len(reviews) >= 1
          assert all(r.get('author') and r.get('body') and 1 <= int(r.get('rating', 0)) <= 5 for r in reviews)
          print(f"Validated {len(reviews)} TrustReviews review cards for product {payload['product_id']}.")
          PY

      - name: Create proposed Shopify development theme
        if: steps.scope.outputs.relevant == 'true'
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          DEV_CONTEXT="pr-${{ github.event.pull_request.number }}-proposed"

          npx shopify theme push             --path /tmp/bhd-theme             --store "$SHOPIFY_FLAG_STORE"             --password "$SHOPIFY_CLI_THEME_TOKEN"             --development             --development-context "$DEV_CONTEXT"             --json > /tmp/shopify-preview.json

          cp /tmp/shopify-preview.json artifacts/shopify-preview.json

          THEME_ID="$(jq -er '.theme.id | tostring' /tmp/shopify-preview.json)"
          ROLE="$(jq -er '.theme.role' /tmp/shopify-preview.json)"
          echo "theme_id=$THEME_ID" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_THEME_ID=$THEME_ID" >> "$GITHUB_ENV"

          if [ "$ROLE" != "development" ]; then
            echo "::error::Expected proposed development theme, got role=$ROLE"
            exit 1
          fi

          jq -r '.theme.errors // {} | keys[]' /tmp/shopify-preview.json > /tmp/theme-error-files.txt || true
          if [ -s /tmp/theme-error-files.txt ]; then
            echo "::notice::Shopify reported upload errors in theme files. Only changed-file errors block this PR."
            while IFS= read -r error_file; do
              if grep -Fxq "$error_file" /tmp/pr-changed-files.txt; then
                echo "::error::Changed file failed Shopify upload: $error_file"
                jq -r --arg f "$error_file" '.theme.errors[$f][]?' /tmp/shopify-preview.json
                exit 1
              fi
            done < /tmp/theme-error-files.txt
          fi

      - name: Start authenticated renderer for isolated preview
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # theme push's preview URL selects a theme but does not authenticate
          # hidden Page reads. Let the supported CLI proxy own that session.
          # Reuse only the development theme created and role-checked above.
          # Keep the existing changed-file upload gate authoritative. Re-uploading
          # known rejected, unchanged baseline files makes CLI dev return its
          # global upload-error page (HTTP 500) before rendering any route.
          python3 - <<'PY_UPLOAD_GUARD'
          import json, pathlib, re, subprocess
          base = "${{ github.event.pull_request.base.sha }}"
          changed = set(pathlib.Path('/tmp/pr-changed-files.txt').read_text().splitlines())
          errors = json.loads(pathlib.Path('/tmp/shopify-preview.json').read_text())['theme'].get('errors', {})
          for filename, messages in errors.items():
              print(f'Shopify upload error: {filename}: {messages}', flush=True)
          # These template families cannot render the tested index, Page,
          # product or cart routes. Never exclude shared Liquid/assets/config,
          # or ANY Page/product/index/cart template, even if unchanged.
          unrelated = {'article', 'blog', 'collection', 'list-collections', 'search', 'gift_card', 'password', '404'}
          orphan_candidates = {f'snippets/bhd-hero-mobile-{kind}.liquid' for kind in ('performance', 'medical', 'humanitarian', 'daily')}
          source_files = [p for folder in ('assets', 'blocks', 'config', 'layout', 'locales', 'sections', 'snippets', 'templates') for p in pathlib.Path('/tmp/bhd-theme', folder).rglob('*') if p.is_file()]
          allowed = []
          for name, messages in errors.items():
              path = pathlib.PurePosixPath(name)
              family = path.name.split('.')[0]
              unrelated_template = path.parent == pathlib.PurePosixPath('templates') and family in unrelated
              proven_orphan = name in orphan_candidates
              if proven_orphan:
                  for source in source_files:
                      if source == pathlib.Path('/tmp/bhd-theme', name): continue
                      content = source.read_text(errors='replace')
                      if path.stem in content:
                          proven_orphan = False; break
                      # App-block rendering does not resolve theme snippets.
                      for tag in re.findall(r'{%[-]?(.*?)[-]?%}', content, re.S):
                          for statement in tag.splitlines():
                              match = re.match(r"\s*(?:render|include)\s+(.+)", statement)
                              if match and not (match[1].startswith(("'", '\"')) or match[1].strip() == 'block'):
                                  proven_orphan = False
              if name in changed or not (unrelated_template or proven_orphan):
                  raise SystemExit(f'Required or unproven template upload error: {name}: {messages}')
              original = subprocess.run(['git', 'show', f'{base}:{name}'], capture_output=True, check=True).stdout
              if original != pathlib.Path('/tmp/bhd-theme', name).read_bytes():
                  raise SystemExit(f'Rejected file differs from target base: {name}')
              allowed.append(name)
              print(f'Verified unchanged unrelated exclusion: {name}: {messages}')
          pathlib.Path('/tmp/verified-preview-exclusions.txt').write_text(''.join(name + '\n' for name in allowed))
          PY_UPLOAD_GUARD
          baseline_ignore=()
          while IFS= read -r error_file; do
            [ -n "$error_file" ] || continue
            baseline_ignore+=(--ignore "$error_file")
          done < /tmp/verified-preview-exclusions.txt
          setsid npx shopify theme dev \
            --path /tmp/bhd-theme \
            --store "$SHOPIFY_FLAG_STORE" \
            --theme "$PREVIEW_THEME_ID" \
            --host 127.0.0.1 --port 9292 \
            --live-reload off --nodelete --no-input --no-color "${baseline_ignore[@]}" \
            > /tmp/bhd-preview-renderer.log 2>&1 &
          echo "$!" > /tmp/bhd-preview-renderer.pid
          echo "BASE_URL=http://127.0.0.1:9292" >> "$GITHUB_ENV"

      - name: Verify rendered preview responds
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="$BASE_URL/?preview_theme_id=$PREVIEW_THEME_ID&utm_source=qa_automation&utm_medium=playwright&utm_campaign=pr_preview"
          for attempt in {1..8}; do
            code="$(curl --max-time 10 -L -sS -H 'Accept: text/html' -o /tmp/preview-home.html -w '%{http_code}' "$URL" || true)"
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ] && grep -qi '<html' /tmp/preview-home.html; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Shopify rendered preview did not become ready (last HTTP status: $code)."
          python3 - <<'PY_DIAGNOSTICS'
          import os, pathlib, re
          log = pathlib.Path('/tmp/bhd-preview-renderer.log')
          text = log.read_text(errors='replace') if log.exists() else 'Renderer log missing.'
          token = os.environ.get('SHOPIFY_CLI_THEME_TOKEN', '')
          if token:
              text = text.replace(token, '[REDACTED]')
          text = re.sub(r'https?://[^\s<>]+', '[URL REDACTED]', text)
          text = re.sub(r'(?i)(authorization|password|token|cookie)([=: ]+)[^\s,;]+', r'\1\2[REDACTED]', text)
          body_path = pathlib.Path('/tmp/preview-home.html')
          body = body_path.read_text(errors='replace') if body_path.exists() else ''
          # Store readable error text only, never scripts, cookies or URLs.
          from html.parser import HTMLParser
          class ErrorText(HTMLParser):
              def __init__(self):
                  super().__init__(); self.skip = 0; self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style'): self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ('script', 'style'): self.skip = max(0, self.skip - 1)
              def handle_data(self, data):
                  if not self.skip: self.parts.append(data)
          parser = ErrorText(); parser.feed(body)
          safe = '\n'.join(parser.parts)
          if token: safe = safe.replace(token, '[REDACTED]')
          safe = re.sub(r'https?://[^\s<>]+', '[URL REDACTED]', safe)
          safe = re.sub(r'(?i)(authorization|password|token|cookie|session)[^\n]*', r'[SESSION DETAIL REDACTED]', safe)
          safe = re.sub(r'\b[A-Za-z0-9_+/=-]{40,}\b', '[OPAQUE VALUE REDACTED]', safe)
          pathlib.Path('artifacts/preview-response-sanitized.txt').write_text(safe[:16000])
          print('CLI upload-error response:', 'Failed to Upload Theme Files' in body)
          print('CLI rendering-error response:', 'Failed to render storefront' in body)
          print('Renderer diagnostics (last 80 lines):')
          print('\n'.join(text.splitlines()[-80:]))
          PY_DIAGNOSTICS
          exit 1

      - name: Enforce desktop/mobile-only responsive policy
        if: steps.scope.outputs.relevant == 'true'
        run: node scripts/check-responsive-surfaces.mjs

      - name: Capture and validate proposed media pages
        if: steps.scope.outputs.media == 'true'
        run: |
          npx playwright test --config=playwright.config.cjs tests/playwright/media-pages.spec.cjs

      - name: Retain media review evidence
        if: ${{ always() && steps.scope.outputs.media == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ehp-media-review-${{ github.event.pull_request.head.sha }}
          path: artifacts/media-review/
          if-no-files-found: warn
          retention-days: 14

      - name: Run targeted preview smoke
        if: steps.scope.outputs.relevant == 'true'
        env:
          PREVIEW_PATHS: ${{ steps.scope.outputs.preview_paths }}
          PREVIEW_EXPECT_NAV: ${{ steps.scope.outputs.expect_nav }}
        run: |
          if [ "${MEDIA_PREVIEW_FIXTURES:-}" = "1" ]; then
            PREVIEW_PATHS="${PREVIEW_PATHS//\/pages\/folio-hydration-feature/\/pages\/press?view=qa-media-folio}"
            PREVIEW_PATHS="${PREVIEW_PATHS//\/pages\/cbc-edmonton-am/\/pages\/press?view=qa-media-cbc}"
            export PREVIEW_PATHS
          fi
          npx playwright test --config=playwright.config.cjs tests/playwright/pr-preview-gate.spec.cjs

      - name: Run native review responsive contract
        if: steps.scope.outputs.relevant == 'true'
        run: |
          npx playwright test \
            --config=playwright.config.cjs \
            tests/playwright/storefront-smoke.spec.cjs \
            --grep "native reviews are responsive and never clip text" \
            --project=desktop-chromium \
            --project=mobile-chromium

      - name: Stop local renderer before direct purchase preview
        if: steps.scope.outputs.purchase == 'true'
        run: |
          if [ -f /tmp/bhd-preview-renderer.pid ]; then
            renderer_pid="$(cat /tmp/bhd-preview-renderer.pid)"
            kill -- "-$renderer_pid" 2>/dev/null || true
          fi

      - name: Verify actual-stock purchase flow
        if: steps.scope.outputs.purchase == 'true'
        env:
          BASE_URL: https://besthydrate.com
        run: |
          node tests/cart-update.cjs
          npx playwright test --config=playwright.config.cjs tests/playwright/purchase-flow.spec.cjs --retries=0

      - name: Stage isolated zero-stock Liquid fixture
        if: ${{ always() && steps.scope.outputs.purchase == 'true' && steps.preview.outputs.theme_id != '' }}
        id: zero_fixture
        run: |
          python3 scripts/build-zero-stock-preview.py /tmp/bhd-theme
          npx shopify theme push --path /tmp/bhd-theme --store "$SHOPIFY_FLAG_STORE" --password "$SHOPIFY_CLI_THEME_TOKEN" --theme "$PREVIEW_THEME_ID" --nodelete --only snippets/bhd-backorder-notice.liquid --only sections/main-product.liquid --json > /tmp/zero-stock-upload.json
          jq -e '((.theme.errors // {}) | length) == 0' /tmp/zero-stock-upload.json
          mkdir -p /tmp/bhd-fixture-readback
          npx shopify theme pull --path /tmp/bhd-fixture-readback --store "$SHOPIFY_FLAG_STORE" --password "$SHOPIFY_CLI_THEME_TOKEN" --theme "$PREVIEW_THEME_ID" --nodelete --only snippets/bhd-backorder-notice.liquid --only sections/main-product.liquid
          python3 - <<'PY_READBACK'
          import hashlib, json
          from pathlib import Path
          results = {}
          for name in ('snippets/bhd-backorder-notice.liquid', 'sections/main-product.liquid'):
              expected = Path('/tmp/bhd-theme', name).read_bytes()
              actual = Path('/tmp/bhd-fixture-readback', name).read_bytes()
              assert actual == expected, f'Remote fixture mismatch: {name}'
              results[name] = hashlib.sha256(actual).hexdigest()
          Path('artifacts/purchase-review/remote-fixture-readback.json').write_text(json.dumps(results, indent=2))
          print('PASS exact remote fixture SHA256:', json.dumps(results))
          PY_READBACK

      - name: Verify simulated zero-stock purchase flow
        if: ${{ always() && steps.zero_fixture.outcome == 'success' }}
        env:
          BASE_URL: https://besthydrate.com
          SIMULATED_ZERO_STOCK: '1'
        run: npx playwright test --config=playwright.config.cjs tests/playwright/purchase-flow.spec.cjs --retries=0

      - name: Retain purchase-flow review evidence
        if: ${{ always() && steps.scope.outputs.purchase == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ehp-purchase-review-${{ github.event.pull_request.head.sha }}
          path: artifacts/purchase-review/
          retention-days: 14

      - name: Upload failure diagnostics
        if: ${{ failure() && steps.scope.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: shopify-pr-preview-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            artifacts/shopify-preview.json
            artifacts/media-fixtures.json
            artifacts/preview-response-sanitized.txt
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6

      - name: Stop authenticated preview renderer
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/bhd-preview-renderer.pid ]; then
            renderer_pid="$(cat /tmp/bhd-preview-renderer.pid)"
            kill -- "-$renderer_pid" 2>/dev/null || true
          fi

      - name: Delete proposed development preview
        if: ${{ always() && steps.scope.outputs.relevant == 'true' && steps.preview.outputs.theme_id != '' }}
        shell: bash
        run: |
