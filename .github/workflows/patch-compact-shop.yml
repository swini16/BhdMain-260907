name: Patch compact header Shop CTA

on:
  push:
    paths:
      - '.github/workflows/patch-compact-shop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add responsive Shop CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('sections/bhd-header-contrast.liquid')
          s = p.read_text()
          marker = 'compact-header-shop-20260911'
          if marker not in s:
              encoded = ''
              insert = base64.b64decode(encoded).decode('utf-8')
              s = s.replace('\n{% schema %}', insert + '\n{% schema %}', 1)
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "OpenAI storefront automation"
          git config user.email "actions@users.noreply.github.com"
          git add sections/bhd-header-contrast.liquid
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show Shop CTA in compact header"
          git push origin main
