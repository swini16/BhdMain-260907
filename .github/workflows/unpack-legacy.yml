name: Unpack Legacy live theme

on:
  push:
    branches:
      - Legacy
    paths:
      - 'theme_export__besthydrate-com-copy-of-savon__07SEP2026-0243pm.zip'
      - '.github/workflows/unpack-legacy.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Legacy
        uses: actions/checkout@v4
        with:
          ref: Legacy
          fetch-depth: 0

      - name: Unpack live theme at repository root
        shell: bash
        run: |
          ZIP='theme_export__besthydrate-com-copy-of-savon__07SEP2026-0243pm.zip'
          if [ ! -f "$ZIP" ]; then
            echo 'Legacy ZIP already unpacked.'
            exit 0
          fi
          rm -rf assets config layout locales sections snippets templates
          unzip -o "$ZIP" -d .
          rm -f "$ZIP"

      - name: Commit unpacked live theme
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unpack live theme into Legacy'
          git push origin HEAD:Legacy
