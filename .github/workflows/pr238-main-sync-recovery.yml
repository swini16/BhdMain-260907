name: PR238 Shopify MAIN recovery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr238-shopify-main-recovery
  cancel-in-progress: false

jobs:
  release:
    name: Publish verified PR238 tree to Shopify MAIN
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'release/pr238-main-sync-20261021' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_BASE_SHA: fa87925f226904c0cd9ea86f76d804f78b04cf4f
      EXPECTED_RELEASE_SHA: f83341f6f09ffb61c8554bd03da43138343b66ba
      EXPECTED_RELEASE_TREE: 6c0d57c9164dd0a84dc782abe2ddea2e9adc0399
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN || secrets.SHOPIFY_THEME_ACCESS_TOKEN || secrets.SHOPIFY_ADMIN_API_TOKEN || secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_FLAG_STORE: best-hydrate.myshopify.com
      SHOPIFY_CLI_NO_ANALYTICS: '1'
      CI: 'true'

    steps:
      - name: Checkout exact merged release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify immutable release and current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_RELEASE_TREE"
          test "$(git rev-parse 'HEAD^')" = "$EXPECTED_BASE_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_RELEASE_SHA"

      - name: Verify exact Shopify theme release set
        id: release_set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if git diff --name-status "$EXPECTED_BASE_SHA" "$EXPECTED_RELEASE_SHA" -- \
              assets blocks config layout locales sections snippets templates \
              | grep -q '^D'; then
            echo '::error::Release contains a deleted Shopify theme file; recovery is intentionally nodelete-only.'
            exit 1
          fi

          mapfile -t files < <(
            git diff --name-only "$EXPECTED_BASE_SHA" "$EXPECTED_RELEASE_SHA" -- \
              assets blocks config layout locales sections snippets templates \
              | grep -Ev '(^|/)settings_data\.json$' \
              | sort -u
          )

          printf '%s\n' "${files[@]}" | tee artifacts/pr238-shopify-main-files.txt
          test "${#files[@]}" -eq 38

          for required in \
            assets/bhd-lemonade-volume.css \
            assets/bhd-lemonade-volume.js \
            snippets/bhd-lemonade-cart-offer.liquid \
            snippets/bhd-lemonade-volume.liquid \
            sections/main-cart-footer.liquid \
            sections/main-product.liquid \
            snippets/cart-drawer.liquid \
            locales/en.default.json; do
            printf '%s\n' "${files[@]}" | grep -Fxq "$required"
            test -f "$required"
          done

      - name: Re-run merged unit contracts
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install verification and Shopify CLI dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --global @shopify/cli@latest

      - name: Verify merged unit contracts
        run: |
          npm run test:unit
          node scripts/check-responsive-surfaces.mjs

      - name: Verify Shopify MAIN credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SHOPIFY_CLI_THEME_TOKEN:-}"
          test -n "${SHOPIFY_FLAG_STORE:-}"
          shopify version

      - name: Publish exact PR238 theme files to Shopify MAIN
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < artifacts/pr238-shopify-main-files.txt
          args=()
          for file in "${files[@]}"; do
            args+=(--only "$file")
          done

          shopify theme push \
            --path . \
            --store "$SHOPIFY_FLAG_STORE" \
            --password "$SHOPIFY_CLI_THEME_TOKEN" \
            --live \
            --allow-live \
            --nodelete \
            "${args[@]}" \
            --json | tee artifacts/pr238-shopify-main-sync.json

      - name: Verify signed live MAIN storefront readback
        env:
          SHOPIFY_CRAWLER_SIGNATURE_INPUT: ${{ secrets.SHOPIFY_CRAWLER_SIGNATURE_INPUT }}
          SHOPIFY_CRAWLER_SIGNATURE: ${{ secrets.SHOPIFY_CRAWLER_SIGNATURE }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const https = require('node:https');

          const input = process.env.SHOPIFY_CRAWLER_SIGNATURE_INPUT;
          const signature = process.env.SHOPIFY_CRAWLER_SIGNATURE;
          if (!input || !signature) throw new Error('Missing signed crawler authorization for live readback.');

          const paths = [
            '/products/lemonade-best-hydrate',
            '/products/lemonade-electrolyte-best-hydrate',
          ];
          const expected = [
            'bhd-lemonade-volume.css',
            'bhd-lemonade-volume.js',
            '2 jars: 10% off',
            '10+ jars: 20% off',
          ];

          function request(path, attempt) {
            return new Promise((resolve, reject) => {
              const req = https.request({
                hostname: 'besthydrate.com',
                path: `${path}?qa_release=pr238-${Date.now()}-${attempt}`,
                method: 'GET',
                headers: {
                  Accept: 'text/html',
                  'Cache-Control': 'no-cache',
                  'User-Agent': 'Best-Hydrate-Release-Verification/1.0',
                  'Signature-Input': input,
                  Signature: signature,
                  'Signature-Agent': '"https://shopify.com"',
                },
              }, (res) => {
                let body = '';
                res.setEncoding('utf8');
                res.on('data', (chunk) => { body += chunk; });
                res.on('end', () => resolve({ status: res.statusCode || 0, body }));
              });
              req.setTimeout(20000, () => req.destroy(new Error('Live readback timed out.')));
              req.on('error', reject);
              req.end();
            });
          }

          (async () => {
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              for (const path of paths) {
                try {
                  const response = await request(path, attempt);
                  if (response.status === 200 && expected.every((value) => response.body.includes(value))) {
                    console.log(`Live MAIN readback verified at ${path} on attempt ${attempt}.`);
                    return;
                  }
                } catch {
                  // Retry only the bounded allowlisted product paths. Never log signed request details.
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error('Live MAIN did not expose the PR238 assets and quantity-tier copy within the verification window.');
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Record governed release evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr238-shopify-main-release-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
