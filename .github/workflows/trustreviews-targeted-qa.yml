name: TrustReviews targeted QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/playwright/trustreviews-live.spec.cjs'
      - '.github/workflows/trustreviews-targeted-qa.yml'

jobs:
  trustreviews-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @playwright/test@latest
      - run: npx playwright install --with-deps chromium
      - name: Run TrustReviews live QA only
        run: npx playwright test tests/playwright/trustreviews-live.spec.cjs --config=playwright.config.cjs --project=desktop-chromium --project=mobile-chromium --retries=0
